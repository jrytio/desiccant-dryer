# Entry point for ESPHome Device Builder adoption; the production firmware's
# dashboard_import points here. Device Builder writes a short YAML on the
# owner's Home Assistant that pulls this file as a remote package and adds
# the owner's API key, OTA password and WiFi.
#
# Same firmware as desiccant-dryer.yaml (both wrap packages/production.yaml),
# except the drawing component and SVG art come from GitHub at the release
# tag for the version in version.yaml: a remote package cannot read them
# from this repository by relative path. The tag must exist, so this file
# only validates once scripts/release.sh has pushed it; CI does not build it.
substitutions:
  name: desiccant-dryer
  friendly_name: Desiccant Dryer
  ui_ref: v${version}
  display_assets: https://raw.githubusercontent.com/jrytio/desiccant-dryer/v${version}/esphome/assets/display

packages:
  production: !include packages/production.yaml
  ui: !include packages/ui-code-remote.yaml
  # No api encryption block, so Device Builder mints a key into the owner's
  # YAML; the OTA block below inherits it and requires encryption.
  ota: !include packages/ota-adopted.yaml
