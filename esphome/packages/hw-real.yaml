# Real hardware: sensor buses and sensors. Provides the sensor ids base.yaml
# expects: air_rh, air_temp, pack_a_temp, pack_b_temp, case_temp.
#   I2C (Qwiic connector) - SHT45 in the process-air stream after the valves
#   1-wire (16-pin position 13) - DS18B20 x3: pack A, pack B, case
# The GPIOs are ${pin_i2c_sda}, ${pin_i2c_scl} and ${pin_onewire} from
# packages/board-s2.yaml or packages/board-c6.yaml.

# ---------------------------------------------------------------- buses
i2c:
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  frequency: 100kHz

one_wire:
  - platform: gpio
    pin: ${pin_onewire}

sensor:
  - platform: sht4x
    temperature:
      name: "Outlet Air Temperature"
      id: air_temp
    humidity:
      name: "Outlet Air Humidity"
      id: air_rh
      filters:
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
    update_interval: 10s

  # Addresses from the first boot log on the production unit. The probes
  # are labelled on the hardware to match these names (pack B checked by
  # warming it; pack A and case assigned by label).
  - platform: dallas_temp
    address: 0x8b00000071633028
    name: "Pack A Temperature"
    id: pack_a_temp
    update_interval: 10s
  - platform: dallas_temp
    address: 0xc300000070605d28
    name: "Pack B Temperature"
    id: pack_b_temp
    update_interval: 10s
  - platform: dallas_temp
    address: 0xdb0000006f9c0328
    name: "Case Temperature"
    id: case_temp
    update_interval: 10s
