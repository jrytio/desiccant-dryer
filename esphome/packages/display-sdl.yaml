# The screen as an SDL window on the Mac, for the host preview build. Same
# size as the ST7789 and the same ${display_lambda} from
# packages/display-draw.yaml. Refresh is deliberately faster than the panel's
# 5s (see display-st7789.yaml): a fast host preview is useful for iterating
# on the UI and costs nothing since nothing here blocks on real SPI.
# Resizable so it can be scaled up on a Retina screen; SDL scales the
# 240x240 logical frame to the window.
# Not reproduced here: the 8-bit palette, invert_colors, the panel offset
# and the backlight.

display:
  - platform: sdl
    id: panel                   # same id as the ST7789, so ui_draw finds it
    dimensions:
      width: 240
      height: 240
    update_interval: 2s
    auto_clear_enabled: false   # draw_ui() fills the frame itself
    window_options:
      resizable: true
    lambda: ${display_lambda}
