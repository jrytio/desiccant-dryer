# The OTA server for an adopted unit, so the owner never edits YAML.
#
# Only desiccant-dryer-adopt.yaml includes this: the released image keeps no
# OTA server, because an unauthenticated one would let any host on the LAN
# upload firmware to a mains controller.
#
# `encryption:` with no key inherits the API key that ESPHome Device Builder
# mints into the adopted YAML, and its presence is what compiles OTA
# encryption as *required* (a bare `ota:` block would leave plaintext
# uploads accepted).
#
# This file makes the adopt selector fail to validate on its own, with
# "'ota' encryption has no key and there is no 'api' encryption key to
# inherit". That is the expected pre-adoption state: Device Builder
# recognises exactly that error as "only the api key is missing", keeps the
# imported file, mints the key and revalidates. Do not add a key here to
# silence it — a key in a public repository protects nothing, and Device
# Builder refuses to mint when the package supplies its own OTA key.
ota:
  - platform: esphome
    encryption:
