# What the 240x240 screen shows, independent of the panel that draws it.
# packages/display-st7789.yaml (real panel) and packages/display-sdl.yaml
# (host window) both render ${display_lambda}, which here just runs the
# ui_draw script. That script is the only place ids are read: it fills a
# dryer_ui::UiState and hands it to draw_ui() in packages/display_ui.h, which
# draws into the display with id `panel`. Edit display_ui.h (geometry, rules)
# and assets/display/*.svg (art) to change the screen; see
# docs/superpowers/specs/2026-09-14-display-ui-design.md for the design and
# 2026-09-14-cylinder-state-colours-design.md for the cylinder colours.
#
# Assets under assets/display are SVG, rasterised at compile time by ESPHome
# (resvg) into flash. Fonts come from Google Fonts at compile time. Every
# colour used here and in the header is on the panel's RGB 3-3-2 grid. To see
# any state without a board: esphome run esphome/desiccant-dryer-host.yaml
# (live, full controller) or scripts/scenario-shots.sh (twelve fixed states
# rendered through the palette into docs/display/).

substitutions:
  display_lambda: "id(ui_draw).execute();"

esphome:
  includes:
    - packages/display_ui.h

font:
  - file: "gfonts://Barlow@700"
    id: f_temp
    size: 24
    bpp: 4
    glyphs: "0123456789-°"
  - file: "gfonts://Barlow@600"
    id: f_val
    size: 12
    bpp: 4
    glyphs: "0123456789.%-°hm RH"
  - file: "gfonts://Barlow@700"
    id: f_cap
    size: 11
    bpp: 4
    glyphs: "AB"
  - file: "gfonts://Inter@600"
    id: f_label
    size: 8
    bpp: 4
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Inter@700"
    id: f_phase
    size: 8
    bpp: 4
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Inter@500"
    id: f_status
    size: 10
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°·"
  - file: "gfonts://Inter@700"
    id: f_status_b
    size: 10
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°·"

image:
  - file: assets/display/schematic.svg
    id: img_bg
    type: RGB565
    transparency: alpha_channel
    resize: 240x240
  - file: assets/display/valve-open.svg
    id: img_valve_open
    type: RGB565
    transparency: alpha_channel
    resize: 19x17
  - file: assets/display/valve-closed.svg
    id: img_valve_closed
    type: RGB565
    transparency: alpha_channel
    resize: 19x17
  - file: assets/display/flow-in.svg
    id: img_flow_in
    type: RGB565
    transparency: alpha_channel
    resize: 17x26
  - file: assets/display/flow-out.svg
    id: img_flow_out
    type: RGB565
    transparency: alpha_channel
    resize: 27x31
  - file: assets/display/lit-a.svg
    id: img_lit_a
    type: RGB565
    transparency: alpha_channel
    resize: 76x42
  - file: assets/display/lit-b.svg
    id: img_lit_b
    type: RGB565
    transparency: alpha_channel
    resize: 76x42
  # Tinted at draw time: green when the fan runs, shell grey otherwise.
  - file: mdi:fan
    id: img_fan
    type: BINARY
    transparency: chroma_key
    resize: 14x14

script:
  - id: ui_draw
    mode: single
    then:
      - lambda: |-
          dryer_ui::UiState &s = dryer_ui::last_state();
          s.active = id(active_pack);
          s.standby_state = id(standby_state);
          s.fault_code = id(fault_code);
          s.enabled = id(dryer_enabled).state;
          s.sim = id(sim_enabled).state;
          s.fan = id(case_fan).state;
          s.heater_a = id(heater_a).state;
          s.heater_b = id(heater_b).state;
          s.valve_a = id(valve_a).state;
          s.valve_b = id(valve_b).state;
          s.t_a = id(pack_a_temp).state;
          s.t_b = id(pack_b_temp).state;
          s.t_case = id(case_temp).state;
          s.rh = id(ctrl_rh).state;
          s.arm_rh = id(arm_rh).state;
          s.swap_rh = id(swap_rh).state;
          s.service_s = id(service_elapsed_s);
          s.standby_s = id(standby_elapsed_s);
          s.status = id(status_text).state;
          s.fault_msg = id(fault_message).state;
          s.ip = id(ip_addr).state;
          s.uptime_ms = dryer_ui::uptime_since_first_frame(millis());
          dryer_ui::last_assets() = dryer_ui::UiAssets{id(f_temp), id(f_val), id(f_cap), id(f_label), id(f_phase),
                                                       id(f_status), id(f_status_b),
                                                       id(img_bg), id(img_valve_open), id(img_valve_closed),
                                                       id(img_flow_in), id(img_flow_out), id(img_lit_a), id(img_lit_b),
                                                       id(img_fan)};
          dryer_ui::draw_ui(*id(panel), s, dryer_ui::last_assets());
