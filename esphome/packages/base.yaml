# Shared controller for every build. The top-level file supplies ${name}
# and ${friendly_name} and picks a platform package (platform-esp32 or
# platform-host), a hardware package (hw-real or hw-virtual) and the
# display packages. This file must only reference these sensor ids from
# the hardware package: air_rh, air_temp, pack_a_temp, pack_b_temp,
# case_temp. Board, WiFi, OTA and the web server live in the platform
# package, not here.
#
# Outputs (12-pin header), identical on every build (the host build drives no pins):
#   GPIO13  Heater A relay coil (5 V, low-side NPN)     interlocked with B
#   GPIO12  Heater B relay coil                          interlocked with A
#   GPIO11  Valve A  (24 V solenoid, low-side MOSFET)   interlocked with B
#   GPIO10  Valve B                                      interlocked with A
#   GPIO6   Case fan (24 V, low-side MOSFET)
#
# Cycle logic (control tick every 5 s):
#   One pack is "active" (valve open, heater off). The other is "standby" and
#   moves through: WET -> HEATING -> COOLING -> READY.
#     WET      -> HEATING  when outlet RH >= arm_rh (or service time nears max)
#     HEATING  -> COOLING  when pack temp has been >= regen_temp for regen_hold min
#                          (or heater has run regen_max min - logged as a warning)
#     COOLING  -> READY    when pack temp <= cooldown_temp
#     READY    -> swap     when outlet RH >= swap_rh, or service time >= max_service
#   Time: elapsed-second counters advanced by each tick and scaled by
#   time_scale (1.0 in production; the virtual build accelerates it). The
#   counters persist, so a reboot resumes the cycle. Outputs are re-asserted
#   from state every tick (apply_outputs), so a reboot re-opens the active
#   valve and re-lights a heater.
#   Safety: any pack above overtemp -> heaters off + fault. Heater on 5 min
#   with no temperature rise -> fault. Faults latch until cleared in HA.

substitutions:
  # Control ticks (5 s each) the standby heater may keep running without a
  # valid probe reading: 5 ticks = 25 s, which rides out two missed 10 s
  # DS18B20 updates and acts on the third. The counter starts at this value
  # so tolerance only applies once a valid reading has been seen.
  probe_timeout_ticks: "5"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # 700 sits after HARDWARE (800: switches and restored globals are ready) and
  # before DATA (600: intervals and sensors have not started). ESPHome loops
  # already-set-up components while it waits for WiFi during setup, so a low
  # priority here would let the control tick run first.
  on_boot:
    priority: 700
    then:
      - lambda: |-
          // Everything off until the state machine has run once.
          id(heater_a).turn_off();
          id(heater_b).turn_off();
          id(valve_a).turn_off();
          id(valve_b).turn_off();
          id(case_fan).turn_off();
          id(last_tick_ms) = millis();
          // Restored ints index arrays and drive the state machine; clamp them in
          // case flash held garbage.
          if (id(active_pack) < 0 || id(active_pack) > 2) id(active_pack) = 0;
          if (id(standby_state) < 0 || id(standby_state) > 3) id(standby_state) = 0;
          if (id(fault_code) < 0 || id(fault_code) > 3) id(fault_code) = 0;
          // A regen interrupted by a reboot restarts from scratch: the pack may
          // have cooled during the outage, and resuming the old timer would
          // trip the "not heating" check.
          if (id(standby_state) == 1) {
            id(reset_regen_counters).execute();
          }
          ESP_LOGI("cycle", "Boot: active pack %d, standby state %d, fault %d",
                   id(active_pack), id(standby_state), id(fault_code));
          id(boot_done) = true;

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

# ---------------------------------------------------------------- globals
globals:
  # 0 = none, 1 = A, 2 = B
  - id: active_pack
    type: int
    restore_value: true
    initial_value: "0"
  # standby pack state: 0 WET, 1 HEATING, 2 COOLING, 3 READY
  - id: standby_state
    type: int
    restore_value: true
    initial_value: "0"
  # Elapsed counters in scaled seconds. Persisted so a reboot resumes mid-cycle
  # (ESPHome flushes changed keys to flash about once a minute).
  - id: service_elapsed_s
    type: float
    restore_value: true
    initial_value: "0"
  - id: heat_elapsed_s
    type: float
    restore_value: true
    initial_value: "0"
  - id: hold_elapsed_s
    type: float
    restore_value: true
    initial_value: "0"
  # Time in the current standby phase (WET, HEATING, COOLING or READY). Reset
  # whenever standby_state changes, wherever the change was made; the display
  # shows it under the standby pack.
  - id: standby_elapsed_s
    type: float
    restore_value: true
    initial_value: "0"
  # standby_state at the previous tick, to detect the change. -1 = never seen.
  - id: standby_state_seen
    type: int
    restore_value: true
    initial_value: "-1"
  # Standby temp when heating began. NAN = capture on the next valid tick.
  - id: heat_start_temp
    type: float
    restore_value: true
    initial_value: "NAN"
  # 0 none, 1 active pack overtemp, 2 standby pack overtemp,
  # 3 standby heater not heating. Text lives in the Fault Message sensor.
  - id: fault_code
    type: int
    restore_value: true
    initial_value: "0"
  - id: waiting_for_standby
    type: bool
    initial_value: "false"
  # Multiplier on real elapsed time. Production leaves this at 1.0; only the
  # virtual package's "Sim Speed" writes it.
  - id: time_scale
    type: float
    initial_value: "1.0"
  - id: last_tick_ms
    type: uint32_t
    initial_value: "0"
  - id: boot_done
    type: bool
    initial_value: "false"
  # Consecutive control ticks with no standby probe reading. Starts blocked.
  - id: sb_nan_ticks
    type: int
    initial_value: "${probe_timeout_ticks}"

# ---------------------------------------------------------------- tunables
number:
  - platform: template
    name: "Arm RH (start heating standby)"
    id: arm_rh
    unit_of_measurement: "%"
    min_value: 0.5
    max_value: 50
    step: 0.5
    initial_value: 5
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Swap RH"
    id: swap_rh
    unit_of_measurement: "%"
    min_value: 1
    max_value: 60
    step: 0.5
    initial_value: 10
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Regen temp"
    id: regen_temp
    unit_of_measurement: "°C"
    min_value: 40
    max_value: 120
    step: 1
    initial_value: 90
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Regen hold time"
    id: regen_hold_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 15
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Regen max heater time"
    id: regen_max_min
    unit_of_measurement: "min"
    min_value: 5
    max_value: 240
    step: 5
    initial_value: 60
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Cooldown temp"
    id: cooldown_temp
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 80
    step: 1
    initial_value: 40
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Max service time"
    id: max_service_min
    unit_of_measurement: "min"
    min_value: 10
    max_value: 600
    step: 5
    initial_value: 180
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: "Pack overtemp limit"
    id: overtemp
    unit_of_measurement: "°C"
    min_value: 60
    max_value: 125
    step: 1
    initial_value: 120
    restore_value: true
    optimistic: true
    entity_category: config

  # Simulation: when "Simulate Humidity" is on, this value replaces the outlet
  # humidity everywhere the control logic and display use it. Never persisted.
  - platform: template
    name: "Simulated RH"
    id: sim_rh
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 0.5
    initial_value: 2
    restore_value: false
    optimistic: true
    entity_category: config
    icon: mdi:test-tube

# ---------------------------------------------------------------- outputs
switch:
  - platform: gpio
    name: "Heater A"
    id: heater_a
    pin: GPIO13
    restore_mode: ALWAYS_OFF
    interlock: [heater_b]
    interlock_wait_time: 500ms
    icon: mdi:radiator
  - platform: gpio
    name: "Heater B"
    id: heater_b
    pin: GPIO12
    restore_mode: ALWAYS_OFF
    interlock: [heater_a]
    interlock_wait_time: 500ms
    icon: mdi:radiator
  - platform: gpio
    name: "Valve A"
    id: valve_a
    pin: GPIO11
    restore_mode: ALWAYS_OFF
    interlock: [valve_b]
    interlock_wait_time: 500ms
    icon: mdi:valve
  - platform: gpio
    name: "Valve B"
    id: valve_b
    pin: GPIO10
    restore_mode: ALWAYS_OFF
    interlock: [valve_a]
    interlock_wait_time: 500ms
    icon: mdi:valve
  - platform: gpio
    name: "Case Fan"
    id: case_fan
    pin: GPIO6
    restore_mode: ALWAYS_OFF
    icon: mdi:fan

  - platform: template
    name: "Simulate Humidity"
    id: sim_enabled
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: mdi:test-tube
    entity_category: config

  - platform: template
    name: "Dryer Enabled"
    id: dryer_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:power
    on_turn_off:
      - lambda: |-
          id(heater_a).turn_off();
          id(heater_b).turn_off();
          id(valve_a).turn_off();
          id(valve_b).turn_off();
          id(active_pack) = 0;
          id(standby_state) = 0;
          id(reset_cycle_counters).execute();
      # The fan is thermostat-driven, so disabling must also park the
      # thermostat or it would restart the fan on the next reading.
      - climate.control:
          id: fan_thermostat
          mode: "OFF"
      - switch.turn_off: case_fan
    on_turn_on:
      - climate.control:
          id: fan_thermostat
          mode: COOL

button:
  - platform: template
    name: "Clear Fault"
    icon: mdi:alert-remove
    on_press:
      - lambda: |-
          id(fault_code) = 0;
          // A regen that was interrupted by the fault restarts from scratch, for
          // the same reason as on boot: the pack has cooled with the heater off.
          if (id(standby_state) == 1) id(reset_regen_counters).execute();
  - platform: template
    name: "Force Swap"
    icon: mdi:swap-horizontal
    on_press:
      - lambda: ESP_LOGW("cycle", "Force Swap pressed");
      - script.execute: do_swap
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

# ---------------------------------------------------------------- derived sensors
sensor:
  # The humidity the controller actually acts on: real or simulated.
  - platform: template
    name: "Control Humidity"
    id: ctrl_rh
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: |-
      if (id(sim_enabled).state) return id(sim_rh).state;
      return id(air_rh).state;
    update_interval: 5s

  - platform: template
    name: "Service Time"
    id: service_min
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (id(active_pack) == 0) return 0;
      return id(service_elapsed_s) / 60.0f;
    update_interval: 10s

  # Both hold their final value through COOLING and READY so a regen's duration stays visible in HA history; the swap resets them.
  - platform: template
    name: "Standby Heater Time"
    id: heat_min
    unit_of_measurement: "min"
    accuracy_decimals: 1
    entity_category: diagnostic
    lambda: |-
      return id(heat_elapsed_s) / 60.0f;
    update_interval: 10s

  - platform: template
    name: "Regen Hold Time"
    id: hold_min
    unit_of_measurement: "min"
    accuracy_decimals: 1
    entity_category: diagnostic
    lambda: |-
      return id(hold_elapsed_s) / 60.0f;
    update_interval: 10s

  - platform: template
    name: "Standby Phase Time"
    id: standby_phase_min
    unit_of_measurement: "min"
    accuracy_decimals: 1
    entity_category: diagnostic
    lambda: |-
      return id(standby_elapsed_s) / 60.0f;
    update_interval: 10s

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: template
    name: "Fault"
    device_class: problem
    lambda: return id(fault_code) != 0;

text_sensor:
  # Single place the fault code becomes text; the display reads this too.
  - platform: template
    name: "Fault Message"
    id: fault_message
    update_interval: 5s
    lambda: |-
      switch (id(fault_code)) {
        case 1: return std::string("Active pack overtemp");
        case 2: return std::string("Standby pack overtemp");
        case 3: return std::string("Standby heater not heating");
        default: return std::string("");
      }
  - platform: template
    name: "Standby State"
    id: standby_state_text
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      const char* st[] = {"wet", "heating", "cooling", "ready"};
      return std::string(st[id(standby_state)]);
  - platform: template
    name: "Dryer Status"
    id: status_text
    update_interval: 5s
    lambda: |-
      if (!id(dryer_enabled).state) return std::string("Disabled");
      if (id(active_pack) == 0) return std::string("Starting");
      std::string act = id(active_pack) == 1 ? "A" : "B";
      std::string sb  = id(active_pack) == 1 ? "B" : "A";
      const char* st[] = {"wet", "heating", "cooling", "ready"};
      std::string s = "Air via " + act + ", " + sb + " " + st[id(standby_state)];
      if (id(waiting_for_standby)) s += " (waiting)";
      return s;

# ---------------------------------------------------------------- fan thermostat
climate:
  - platform: thermostat
    name: "Case Fan Thermostat"
    id: fan_thermostat
    sensor: case_temp
    min_cooling_off_time: 60s
    min_cooling_run_time: 60s
    min_idle_time: 30s
    cool_action:
      - switch.turn_on: case_fan
    idle_action:
      - switch.turn_off: case_fan
    default_preset: Normal
    preset:
      - name: Normal
        default_target_temperature_high: 35
        mode: cool
    cool_deadband: 1.5
    cool_overrun: 1.5
    visual:
      min_temperature: 20
      max_temperature: 60
      temperature_step: 1

# ---------------------------------------------------------------- cycle logic
script:
  # Counter resets shared by boot, disable, first run, swap and Clear Fault.
  - id: reset_regen_counters
    mode: single
    then:
      - lambda: |-
          id(heat_elapsed_s) = 0;
          id(hold_elapsed_s) = 0;
          id(standby_elapsed_s) = 0;
          id(heat_start_temp) = NAN;
  - id: reset_cycle_counters
    mode: single
    then:
      - lambda: |-
          id(service_elapsed_s) = 0;
          id(waiting_for_standby) = false;
          id(reset_regen_counters).execute();
  # A standby_state change made during this tick starts the phase timer at
  # zero right away, so the display never pairs the new phase with the old
  # phase's time and the next tick's dt is counted, not discarded.
  - id: sync_standby_phase
    mode: single
    then:
      - lambda: |-
          if (id(standby_state) != id(standby_state_seen)) {
            id(standby_state_seen) = id(standby_state);
            id(standby_elapsed_s) = 0;
          }
  # Outputs are a pure function of state. Runs at the end of every control
  # tick, so a reboot or a missed transition can never leave the active valve
  # closed or a heater in the wrong state. Each switch is written only when
  # its state differs, so this is silent (even at DEBUG) when nothing changes.
  # Order matters with interlocks: the partner goes off before the other goes on.
  - id: apply_outputs
    mode: single
    then:
      - lambda: |-
          if (id(active_pack) == 0) return;
          const bool a_active = (id(active_pack) == 1);
          const float t_sb = a_active ? id(pack_b_temp).state : id(pack_a_temp).state;
          const bool sb_heat = id(standby_state) == 1 && id(fault_code) == 0
                               && (!isnan(t_sb) || id(sb_nan_ticks) < ${probe_timeout_ticks});
          if (a_active) {
            if (id(valve_b).state)  id(valve_b).turn_off();
            if (!id(valve_a).state) id(valve_a).turn_on();
            if (id(heater_a).state) id(heater_a).turn_off();
            if (id(heater_b).state != sb_heat) { if (sb_heat) id(heater_b).turn_on(); else id(heater_b).turn_off(); }
          } else {
            if (id(valve_a).state)  id(valve_a).turn_off();
            if (!id(valve_b).state) id(valve_b).turn_on();
            if (id(heater_b).state) id(heater_b).turn_off();
            if (id(heater_a).state != sb_heat) { if (sb_heat) id(heater_a).turn_on(); else id(heater_a).turn_off(); }
          }

  - id: do_swap
    mode: single
    then:
      - lambda: |-
          if (id(active_pack) == 0) return;
          int next = (id(active_pack) == 1) ? 2 : 1;
          ESP_LOGI("cycle", "Swapping air to pack %s", next == 1 ? "A" : "B");
          // heater off on the pack about to go into service
          if (next == 1) id(heater_a).turn_off(); else id(heater_b).turn_off();
          id(valve_a).turn_off();
          id(valve_b).turn_off();
      - delay: 500ms
      - lambda: |-
          if (id(active_pack) == 0) return;   // disabled during the delay
          int next = (id(active_pack) == 1) ? 2 : 1;
          if (next == 1) id(valve_a).turn_on(); else id(valve_b).turn_on();
          id(active_pack) = next;
          id(standby_state) = 0;          // the pack just retired is WET
          id(reset_cycle_counters).execute();

interval:
  - interval: 5s
    then:
      - lambda: |-
          if (!id(boot_done)) return;   // never run before on_boot has reset outputs and counters
          if (!id(dryer_enabled).state) return;
          if (id(do_swap).is_running()) return;   // never fight the both-closed window

          // --- scaled time step
          const uint32_t now = millis();
          float dt_real = (now - id(last_tick_ms)) / 1000.0f;
          id(last_tick_ms) = now;
          if (dt_real > 60.0f) dt_real = 60.0f;   // stalled-loop guard (OTA, long block)
          const float dt = dt_real * id(time_scale);

          // --- standby phase timer. Transitions made inside a tick are caught
          // by sync_standby_phase below; a change seen here happened between
          // ticks (do_swap, disable), so this interval belongs to the new phase.
          if (id(standby_state) != id(standby_state_seen)) {
            id(standby_state_seen) = id(standby_state);
            id(standby_elapsed_s) = dt;
          } else {
            id(standby_elapsed_s) += dt;
          }

          // --- first run / after a disable: start on pack A
          if (id(active_pack) == 0) {
            id(active_pack) = 1;
            id(standby_state) = 0;
            id(reset_cycle_counters).execute();
            ESP_LOGI("cycle", "Starting on pack A");
            id(apply_outputs).execute();
            return;
          }

          const bool a_active = (id(active_pack) == 1);
          const float t_sb  = a_active ? id(pack_b_temp).state : id(pack_a_temp).state;
          const float t_act = a_active ? id(pack_a_temp).state : id(pack_b_temp).state;
          const float rh    = id(ctrl_rh).state;
          // Flag a wanted-but-blocked swap even while faulted or waiting on sensors.
          id(waiting_for_standby) = (id(standby_state) != 3 && !isnan(rh) && rh >= id(swap_rh).state);

          // Tolerate missed probe readings (DS18B20 CRC errors are routine on a
          // shared bus) for probe_timeout_ticks; then apply_outputs drops the
          // heater and an interrupted regen restarts when the probe returns.
          if (isnan(t_sb)) {
            if (id(sb_nan_ticks) < ${probe_timeout_ticks}) id(sb_nan_ticks) += 1;
            if (id(sb_nan_ticks) == ${probe_timeout_ticks} && id(standby_state) == 1) {
              id(reset_regen_counters).execute();
              ESP_LOGW("cycle", "Standby probe lost; heater off, regen restarts when it returns");
            }
          } else {
            id(sb_nan_ticks) = 0;
          }

          // Service time counts whenever a pack is in service, faults included:
          // air is still flowing through it.
          id(service_elapsed_s) += dt;
          const float service_m = id(service_elapsed_s) / 60.0f;

          // --- safety: overtemp on either pack, checked every tick
          // Latch only when no fault is held, so each fault logs once. A second
          // fault while one is latched is not recorded; heaters are already off.
          if (id(fault_code) == 0 && !isnan(t_act) && t_act > id(overtemp).state) {
            id(fault_code) = 1;
            ESP_LOGE("cycle", "FAULT: active pack overtemp (%.1f C)", t_act);
          }
          if (!isnan(t_sb) && t_sb > id(overtemp).state) {
            id(standby_state) = 2;   // retire it regardless of which fault is held
            if (id(fault_code) == 0) {
              id(fault_code) = 2;
              ESP_LOGE("cycle", "FAULT: standby pack overtemp (%.1f C)", t_sb);
            }
          }
          if (id(fault_code) != 0) { id(sync_standby_phase).execute(); id(apply_outputs).execute(); return; }   // hold until cleared
          if (isnan(rh) || isnan(t_sb)) { id(apply_outputs).execute(); return; }   // sensors not ready

          switch (id(standby_state)) {
            case 0: { // WET - wait for breakthrough to begin, or run out of runway
              const bool near_max = service_m >= id(max_service_min).state - id(regen_max_min).state;
              if (rh >= id(arm_rh).state || near_max) {
                id(standby_state) = 1;
                id(reset_regen_counters).execute();
                id(heat_start_temp) = t_sb;
                ESP_LOGI("cycle", "Standby heater on (RH %.1f%%, service %.0f min)", rh, service_m);
              }
              break;
            }
            case 1: { // HEATING
              if (isnan(id(heat_start_temp))) {
                // First tick after a reboot into HEATING: record where the pack
                // is and let apply_outputs re-light the heater. Timing and the
                // rise check start on the next tick, otherwise a large scaled dt
                // would arm the "not heating" check with no heating time.
                id(heat_start_temp) = t_sb;
                break;
              }
              id(heat_elapsed_s) += dt;
              const float heat_m = id(heat_elapsed_s) / 60.0f;
              // "Not heating": 5 min on with under 5 C of rise, judged only while
              // still below regen temp. A pack already at regen temp is heating
              // fine even if it can't rise another 5 C (matters after a reboot,
              // when the start temp is captured from an already-hot pack).
              if (id(heat_elapsed_s) >= 300.0f && t_sb < id(heat_start_temp) + 5.0f
                  && t_sb < id(regen_temp).state) {
                id(fault_code) = 3;
                id(standby_state) = 2;
                ESP_LOGE("cycle", "FAULT: standby heater not heating (%.1f C after %.0f min)", t_sb, heat_m);
                break;
              }
              if (t_sb >= id(regen_temp).state) id(hold_elapsed_s) += dt; else id(hold_elapsed_s) = 0;
              if (id(hold_elapsed_s) >= id(regen_hold_min).state * 60.0f) {
                id(standby_state) = 2;
                ESP_LOGI("cycle", "Regen complete after %.0f min", heat_m);
              } else if (id(heat_elapsed_s) >= id(regen_max_min).state * 60.0f) {
                id(standby_state) = 2;
                ESP_LOGW("cycle", "Regen hit max heater time (%.0f min)", heat_m);
              }
              break;
            }
            case 2: { // COOLING
              if (t_sb <= id(cooldown_temp).state) {
                id(standby_state) = 3;
                ESP_LOGI("cycle", "Standby pack ready");
              }
              break;
            }
            case 3: { // READY
              if (rh >= id(swap_rh).state || service_m >= id(max_service_min).state) {
                ESP_LOGI("cycle", "Swap: standby ready (RH %.1f%%, service %.0f min)", rh, service_m);
                id(do_swap).execute();
                return;   // outputs are re-asserted on the next tick, after the swap
              }
              break;
            }
          }

          // Recompute after the state machine so a pack that just became READY
          // does not show "(waiting)" for one tick.
          id(waiting_for_standby) = (id(standby_state) != 3 && rh >= id(swap_rh).state);
          id(sync_standby_phase).execute();
          id(apply_outputs).execute();
