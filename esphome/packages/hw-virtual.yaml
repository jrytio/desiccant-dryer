# Virtual hardware: nothing attached. A small plant model produces the five
# sensor ids base.yaml expects (air_rh, air_temp, pack_a_temp, pack_b_temp,
# case_temp) from the real GPIO output states, in time scaled by "Sim Speed".
#
# Model (first-order, integrated every second in scaled time):
#   pack temp  -> heater max while its heater coil is energised (the switch,
#                 or Sim Relay Stuck On A), else -> ambient, with one thermal
#                 time constant for both directions
#   case temp  -> ambient + 8 C while any heater is on, or + 2 C with the fan
#                 running as well; 10 min time constant, never below ambient
#   outlet RH  =  1 % until the service time of the pack air is actually
#                 flowing through passes the breakthrough point, then rises
#                 linearly; resets when a different pack comes on line
#
# Air path: valve A has a modelled position that normally follows the Valve A
# switch and latches while Sim Valve Stuck A is on. Outlet RH derives from that
# position, not from the controller's active_pack, so a valve that never moved
# keeps the wet pack on line and RH goes on climbing through a swap.
#
# Everything here is a test-bench control and persists across reboots so the
# reboot tests keep their settings. That is deliberately different from the
# base "Override Humidity" switch, which never persists.

globals:
  - id: plant_t_a
    type: float
    restore_value: true
    initial_value: "25.0"
  - id: plant_t_b
    type: float
    restore_value: true
    initial_value: "25.0"
  - id: plant_t_case
    type: float
    restore_value: true
    initial_value: "25.0"
  - id: plant_last_ms
    type: uint32_t
    initial_value: "0"
  # Valve A's real-world position. Only A has a stuck knob, so valve B's
  # position is read straight off its switch.
  - id: plant_valve_a
    type: bool
    restore_value: true
    initial_value: "false"
  # Which pack air is actually flowing through: 0 none, 1 A, 2 B.
  - id: plant_flow_pack
    type: int
    restore_value: true
    initial_value: "0"
  # Scaled seconds that pack has been on line since a different pack was. The
  # controller's own service_elapsed_s is not used: it resets on a commanded
  # swap whether or not the air path actually changed.
  - id: plant_service_s
    type: float
    restore_value: true
    initial_value: "0"

number:
  - platform: template
    name: "Sim Speed"
    id: sim_speed
    unit_of_measurement: "x"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 1
    restore_value: true
    optimistic: true
    entity_category: config
    icon: mdi:test-tube
  - platform: template
    name: "Sim Ambient Temp"
    id: sim_ambient
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 25
    restore_value: true
    optimistic: true
    entity_category: config
    icon: mdi:test-tube
  - platform: template
    name: "Sim Heater Max Temp"
    id: sim_heater_max
    unit_of_measurement: "°C"
    min_value: 40
    max_value: 150
    step: 1
    initial_value: 110
    restore_value: true
    optimistic: true
    entity_category: config
    icon: mdi:test-tube
  - platform: template
    name: "Sim Thermal Time Constant"
    id: sim_tau_min
    unit_of_measurement: "min"
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    entity_category: config
    icon: mdi:test-tube
  - platform: template
    name: "Sim Breakthrough Time"
    id: sim_breakthrough_min
    unit_of_measurement: "min"
    min_value: 0
    max_value: 600
    step: 5
    initial_value: 60
    restore_value: true
    optimistic: true
    entity_category: config
    icon: mdi:test-tube
  - platform: template
    name: "Sim RH Rise Rate"
    id: sim_rh_rate
    unit_of_measurement: "%/min"
    min_value: 0.01
    max_value: 10
    step: 0.01
    initial_value: 0.1
    restore_value: true
    optimistic: true
    entity_category: config
    icon: mdi:test-tube
  - platform: template
    name: "Sim Pack A Temp"
    id: sim_pack_a_temp
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 150
    step: 1
    initial_value: 25
    restore_value: true
    optimistic: true
    entity_category: config
    icon: mdi:test-tube
  - platform: template
    name: "Sim Pack B Temp"
    id: sim_pack_b_temp
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 150
    step: 1
    initial_value: 25
    restore_value: true
    optimistic: true
    entity_category: config
    icon: mdi:test-tube

switch:
  # Heater on produces no heat: exercises the "not heating" fault.
  - platform: template
    name: "Sim Heater Fault"
    id: sim_heater_fault
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # Pin both pack temps to the two Sim Pack temp numbers. The heaters then have
  # no effect, so raise the pinned value yourself or expect the controller's
  # "not heating" fault.
  - platform: template
    name: "Sim Manual Temps"
    id: sim_manual_temps
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # While on, that pack's probe publishes NaN (a dead or noisy DS18B20). The
  # plant keeps integrating underneath, so the real temperature is there when
  # the switch goes off again.
  - platform: template
    name: "Sim Probe A Fault"
    id: sim_probe_a_fault
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  - platform: template
    name: "Sim Probe B Fault"
    id: sim_probe_b_fault
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # A welded relay contact: heater A keeps heating pack A whatever the
  # Heater A switch is commanded to do.
  - platform: template
    name: "Sim Relay Stuck On A"
    id: sim_relay_stuck_on_a
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # pack_a_temp publishes exactly 85.0, the DS18B20 power-on sentinel a
  # probe returns before its first conversion completes.
  - platform: template
    name: "Sim Probe 85C"
    id: sim_probe_85c
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # pack_a_temp publishes -127, the DS18B20 out-of-range fault code.
  # Takes precedence over Sim Probe 85C if both are on.
  - platform: template
    name: "Sim Probe Garbage A"
    id: sim_probe_garbage_a
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # case_temp publishes NaN (dead case DS18B20).
  - platform: template
    name: "Sim Case Probe Fault"
    id: sim_case_probe_fault
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # Crossed or duplicated addresses: pack_b_temp republishes pack A's
  # plant temperature instead of its own.
  - platform: template
    name: "Sim Probes Swapped"
    id: sim_probes_swapped
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # air_rh publishes NaN (dead or disconnected SHT45).
  - platform: template
    name: "Sim RH Fault"
    id: sim_rh_fault
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # A hung I2C bus: air_rh republishes its last value every tick. Sim RH
  # Fault wins if both are on, so the freeze can be followed by a loss.
  - platform: template
    name: "Sim RH Frozen"
    id: sim_rh_frozen
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # The case model stops responding to the fan, so the enclosure heats as
  # if the fan were absent. There is no tachometer to notice this.
  - platform: template
    name: "Sim Fan Stalled"
    id: sim_fan_stalled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube
  # Valve A's modelled position latches where it was and ignores every
  # further command (mechanically stuck, no position feedback). Left open
  # through a swap it keeps the wet pack on line, so outlet RH goes on
  # climbing instead of resetting.
  - platform: template
    name: "Sim Valve Stuck A"
    id: sim_valve_stuck_a
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: mdi:test-tube

interval:
  - interval: 1s
    then:
      - lambda: |-
          // A knob's state is NaN only if it has never been published; fall back
          // to its default so a NaN can never be integrated into the plant state
          // (NaN is absorbing and would persist to flash).
          auto knob = [](float v, float dflt) { return isnan(v) ? dflt : v; };
          float speed = knob(id(sim_speed).state, 1.0f);
          if (speed < 1.0f) speed = 1.0f;
          id(time_scale) = speed;

          // First tick after boot: seed the clock and skip integration so boot
          // time is not applied to the restored plant state.
          const uint32_t now = millis();
          if (id(plant_last_ms) == 0) { id(plant_last_ms) = now; return; }
          float dt_real = (now - id(plant_last_ms)) / 1000.0f;
          id(plant_last_ms) = now;
          // Clamped tighter than the control tick's 60 s on purpose: after a
          // stall the plant does not chase the controller's clock.
          if (dt_real > 5.0f) dt_real = 5.0f;
          const float dt = dt_real * speed;

          const float ambient    = knob(id(sim_ambient).state, 25.0f);
          const float heater_max = knob(id(sim_heater_max).state, 110.0f);
          const float tau        = knob(id(sim_tau_min).state, 5.0f) * 60.0f;
          const float k = 1.0f - expf(-dt / tau);          // exact first-order step

          // A welded contact heats the pack whatever the switch says; a failed
          // element produces no heat either way.
          const bool coil_a = id(heater_a).state || id(sim_relay_stuck_on_a).state;
          const bool heat_a = coil_a && !id(sim_heater_fault).state;
          const bool heat_b = id(heater_b).state && !id(sim_heater_fault).state;
          id(plant_t_a) += ((heat_a ? heater_max : ambient) - id(plant_t_a)) * k;
          id(plant_t_b) += ((heat_b ? heater_max : ambient) - id(plant_t_b)) * k;
          if (id(sim_manual_temps).state) {
            id(plant_t_a) = knob(id(sim_pack_a_temp).state, 25.0f);
            id(plant_t_b) = knob(id(sim_pack_b_temp).state, 25.0f);
          }

          // A failed element still warms the case, so this is deliberately not
          // gated by Sim Heater Fault.
          const bool any_heat = coil_a || id(heater_b).state;
          // The fan carries most of that heat out, but cannot pull the case
          // below ambient. A stalled fan is one with no effect and no tacho.
          const bool fan = id(case_fan).state && !id(sim_fan_stalled).state;
          const float target_case = ambient + (any_heat ? (fan ? 2.0f : 8.0f) : 0.0f);
          id(plant_t_case) += (target_case - id(plant_t_case)) * (1.0f - expf(-dt / 600.0f));

          // A stuck valve ignores further commands; everything else follows.
          if (!id(sim_valve_stuck_a).state) id(plant_valve_a) = id(valve_a).state;
          const bool a_open = id(plant_valve_a), b_open = id(valve_b).state;
          // One valve open decides the path. Both closed is the 500 ms window
          // inside a swap, or a reboot before the controller re-asserts, and
          // both open is a stuck valve: in either case the pack already on line
          // keeps the air, so the path holds rather than resetting.
          int flow = (a_open == b_open) ? id(plant_flow_pack) : (a_open ? 1 : 2);
          if (id(active_pack) == 0) flow = 0;   // stopped or not yet started
          if (flow != id(plant_flow_pack)) {
            id(plant_flow_pack) = flow;
            id(plant_service_s) = 0;            // a different pack: fresh desiccant
          } else if (flow != 0) {
            id(plant_service_s) += dt;
          }

          const float service_min = id(plant_service_s) / 60.0f;
          float rh = 1.0f + fmaxf(0.0f, service_min - knob(id(sim_breakthrough_min).state, 60.0f))
                          * knob(id(sim_rh_rate).state, 0.1f);
          if (rh > 100.0f) rh = 100.0f;

          // Publish from the tick instead of polling, so the controller never
          // sees a value older than one plant tick regardless of Sim Speed.
          // Rounded to 0.1 so an unchanged reading at 1x is the same value
          // and HA records nothing; no filter sits between here and .state.
          // The sensor-fault knobs act here and nowhere else, so the plant keeps
          // integrating underneath one and the true value is back the moment it
          // goes off. Nothing below may reach a persisted global.
          auto r1 = [](float v) { return roundf(v * 10.0f) / 10.0f; };
          float t_a = r1(id(plant_t_a));
          if (id(sim_probe_85c).state)      t_a = 85.0f;
          if (id(sim_probe_garbage_a).state) t_a = -127.0f;
          if (id(sim_probe_a_fault).state)  t_a = NAN;
          id(pack_a_temp).publish_state(t_a);

          float t_b = r1(id(sim_probes_swapped).state ? id(plant_t_a) : id(plant_t_b));
          if (id(sim_probe_b_fault).state) t_b = NAN;
          id(pack_b_temp).publish_state(t_b);

          id(case_temp).publish_state(id(sim_case_probe_fault).state ? NAN : r1(id(plant_t_case)));

          // Frozen republishes the sensor's own last value; before the first
          // publish there is none, so the plant's value stands in.
          float rh_pub = r1(rh);
          if (id(sim_rh_frozen).state && !isnan(id(air_rh).state)) rh_pub = id(air_rh).state;
          if (id(sim_rh_fault).state) rh_pub = NAN;
          id(air_rh).publish_state(rh_pub);
          id(air_temp).publish_state(r1(ambient + 2.0f));

# Published by the plant tick above, already rounded; nothing here filters.
sensor:
  - platform: template
    name: "Outlet Air Humidity"
    id: air_rh
    unit_of_measurement: "%"
    accuracy_decimals: 1
    device_class: humidity
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Outlet Air Temperature"
    id: air_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Pack A Temperature"
    id: pack_a_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Pack B Temperature"
    id: pack_b_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never
  - platform: template
    name: "Case Temperature"
    id: case_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never
