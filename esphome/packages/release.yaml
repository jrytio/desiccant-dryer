# Production-only: version identity, first-time provisioning, the Home
# Assistant update entity and the diagnostics a remote operator needs.
# See docs/releasing.md.
#
# The release image carries no credentials (packages/dev-secrets.yaml is
# only in the test builds). The owner sets WiFi through Improv on the USB
# serial port (web.esphome.io does this) or the fallback access point, and
# Home Assistant adopts the device and sets its API encryption key. There
# is deliberately no ESPHome OTA server: without a password it would let
# any host on the LAN upload firmware to a mains controller. Firmware
# arrives only through the signed-off release below or the USB port.
#
# The device polls ${update_manifest_url}, the esp-web-tools manifest on
# the repository's GitHub Pages site, and reports an update to Home
# Assistant when the manifest's version differs from ${version}.
# Installing pulls the .ota.bin over HTTPS (the relative path in the
# manifest resolves next to it) and checks its md5. Pages, not the GitHub
# Release download URL: that one redirects to an RSA-certificate host
# with a ~900-byte signed URL, and the S2 has too little free heap for the
# second handshake (see the sdkconfig notes in platform-esp32.yaml).

substitutions:
  update_manifest_url: https://jrytio.github.io/desiccant-dryer/firmware/manifest.json

esphome:
  project:
    name: jrytio.desiccant-dryer
    version: "${version}"

# A fresh unit has no API client until it is adopted; ESPHome's default
# would reboot it every 15 min meanwhile. The controller must run without
# Home Assistant, so the API watchdog is off.
api:
  reboot_timeout: 0s

improv_serial:

http_request:
  verify_ssl: true
  timeout: 10s
  # GitHub Pages answers directly, with no redirect, so the request and
  # response headers stay short. (The old releases/latest/download URL
  # redirected twice, the second time to a ~900-byte signed URL on an RSA
  # host, which neither the default buffers nor the S2's free heap could
  # take.) Kept a little above the 512-byte default for header headroom.
  buffer_size_rx: 1024

ota:
  - platform: http_request

# The web server's own firmware-upload page is the same unauthenticated
# LAN reflash path; the status pages and controls stay.
web_server:
  ota: false

update:
  - platform: http_request
    name: "Firmware"
    source: ${update_manifest_url}
    update_interval: 6h

safe_mode:

# Diagnostics for remote bring-up: what image is running, why it last
# rebooted and how much RAM is left (the S2 has none to spare).
debug:
  update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    icon: mdi:tag
    lambda: return {"${version}"};
  - platform: debug
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: debug
    free:
      name: "Free Heap"
    # TLS needs contiguous blocks; total free heap alone hid 1.0.0's
    # failed manifest fetch.
    block:
      name: "Largest Free Block"
    loop_time:
      name: "Loop Time"
