# Production-only: version identity, first-time provisioning and the
# diagnostics a remote operator needs. See docs/releasing.md.
#
# The release image carries no credentials (packages/dev-secrets.yaml is
# only in the test builds). The owner sets WiFi through Improv on the USB
# serial port (web.esphome.io does this) or the fallback access point, and
# Home Assistant sets the API encryption key when it adopts the device.
# Later updates come from the update entity below; no add-on is needed.
#
# The released image has no ESPHome OTA *server*, and the normal LAN path
# is strictly pull-based, through the update entity below.
#
# That is not the whole story: `captive_portal:` (packages/platform-esp32.yaml)
# AUTO_LOADs `ota.web_server`, whose POST /update handler stays reachable
# whenever the captive portal is active — i.e. during a WiFi outage, over
# the open "${friendly_name} Setup" fallback AP. That is an accepted trade
# for provisioning convenience, not an oversight; it is closed by either
# passwording the AP or dropping `captive_portal:`, neither of which this
# repo currently does.
#
# 1.0.x tried this and failed: with ili9xxx's mandatory full frame buffer
# the S2 never had the ~16,749-byte contiguous block a TLS record needs.
# Moving the panel to mipi_spi with a reduced buffer freed it. See
# packages/display-st7789.yaml.

# The device polls this esp-web-tools manifest on the repository's GitHub
# Pages site and reports an update to Home Assistant when the manifest's
# version differs from ${version}. Installing pulls the .ota.bin over HTTPS
# (the relative path in the manifest resolves next to it) and checks its md5.
#
# Pages, not the GitHub Release download URL: that one redirects to an
# RSA-certificate host with a ~900-byte signed URL, and the S2 has too
# little free heap for the second handshake.
substitutions:
  update_manifest_url: https://jrytio.github.io/desiccant-dryer/firmware/manifest.json

esphome:
  project:
    name: jrytio.desiccant-dryer
    version: "${version}"

# A fresh unit has no API client until it is adopted; ESPHome's default
# would reboot it every 15 min meanwhile. The controller must run without
# Home Assistant, so the API watchdog is off.
api:
  reboot_timeout: 0s

improv_serial:

# The web server's own firmware-upload page is the same unauthenticated
# LAN reflash path; the status pages and controls stay.
web_server:
  ota: false

safe_mode:

# Diagnostics for remote bring-up: what image is running, why it last
# rebooted and how much RAM is left (the S2 has none to spare).
debug:
  update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    icon: mdi:tag
    lambda: return {"${version}"};
  - platform: debug
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: debug
    free:
      name: "Free Heap"
    block:
      name: "Largest Free Block"
    loop_time:
      name: "Loop Time"

http_request:
  verify_ssl: true
  timeout: 10s
  # GitHub Pages answers directly with no redirect, so the request and
  # response headers stay short. Kept a little above the 512-byte default
  # for header headroom.
  buffer_size_rx: 1024
  # Pages answers directly. Enforce that rather than assume it: following a
  # redirect is how 1.0.x ended up at a ~900-byte signed URL that neither the
  # buffer below nor the S2's heap could take.
  follow_redirects: false

# The download backend for the update entity below. This is not an OTA
# *server*: nothing listens, so no LAN host can push firmware to a mains
# controller. Updates are strictly pull-based.
ota:
  - platform: http_request

# The md5 checked below comes from this same manifest, so it proves the
# download was not corrupted, not who produced it: platform: http_request
# has no code signing. Anyone with push access to gh-pages can run
# arbitrary firmware on every deployed unit within one 6h poll interval.
# That push access is the security boundary for the whole fleet.
#
# Installing an update reboots the unit, which can land mid drying-cycle.
# That fails safe: all outputs use restore_mode: ALWAYS_OFF and are forced
# off in on_boot, so the reboot drops the heaters and valves rather than
# leaving them energised.
update:
  - platform: http_request
    name: "Firmware"
    source: ${update_manifest_url}
    update_interval: 6h
