# Production-only: version identity, first-time provisioning, the Home
# Assistant update entity and the diagnostics a remote operator needs.
# See docs/releasing.md.
#
# The release image carries no credentials (packages/dev-secrets.yaml is
# only in the test builds). The owner sets WiFi through Improv on the USB
# serial port (web.esphome.io does this) or the fallback access point, and
# Home Assistant adopts the device and sets its API encryption key. There
# is deliberately no ESPHome OTA server: without a password it would let
# any host on the LAN upload firmware to a mains controller. Firmware
# arrives only through the signed-off release below or the USB port.
#
# The device polls ${update_manifest_url}, the esp-web-tools manifest that
# .github/workflows/release.yml attaches to every GitHub Release, and
# reports an update to Home Assistant when the manifest's version differs
# from ${version}. Installing pulls the .ota.bin over HTTPS (the relative
# path in the manifest resolves next to it) and checks its md5.

substitutions:
  update_manifest_url: https://github.com/jrytio/desiccant-dryer/releases/latest/download/manifest.json

esphome:
  project:
    name: jrytio.desiccant-dryer
    version: "${version}"

# A fresh unit has no API client until it is adopted; ESPHome's default
# would reboot it every 15 min meanwhile. The controller must run without
# Home Assistant, so the API watchdog is off.
api:
  reboot_timeout: 0s

improv_serial:

http_request:
  verify_ssl: true
  timeout: 10s
  # The releases/latest/download URL answers with a redirect whose signed
  # Location header runs to several hundred bytes; the 512-byte default
  # fails with "Out of buffer" before the manifest is ever read.
  buffer_size_rx: 2048

ota:
  - platform: http_request

# The web server's own firmware-upload page is the same unauthenticated
# LAN reflash path; the status pages and controls stay.
web_server:
  ota: false

update:
  - platform: http_request
    name: "Firmware"
    source: ${update_manifest_url}
    update_interval: 6h

safe_mode:

# Diagnostics for remote bring-up: what image is running, why it last
# rebooted and how much RAM is left (the S2 has none to spare).
debug:
  update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    icon: mdi:tag
    lambda: return {"${version}"};
  - platform: debug
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: debug
    free:
      name: "Free Heap"
    loop_time:
      name: "Loop Time"
