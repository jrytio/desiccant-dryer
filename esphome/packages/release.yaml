# Production-only: version identity, first-time provisioning and the
# diagnostics a remote operator needs. See docs/releasing.md.
#
# The release image carries no credentials (packages/dev-secrets.yaml is
# only in the test builds). The owner sets WiFi through Improv on the USB
# serial port (web.esphome.io does this) or the fallback access point, then
# adopts the unit in ESPHome Device Builder. The adopted YAML holds the
# owner's API key and OTA password, and Device Builder pushes updates with
# ESPHome's native OTA.
#
# The released image itself has no OTA server: without a password it would
# let any host on the LAN upload firmware to a mains controller. It also
# has no on-device HTTP updater. 1.0.x tried one: the S2 (no PSRAM, 58 KB
# display buffer) never had the ~17 KB contiguous block a TLS firmware
# download needs, with dynamic or static mbedTLS buffers.

esphome:
  project:
    name: jrytio.desiccant-dryer
    version: "${version}"

# A fresh unit has no API client until it is adopted; ESPHome's default
# would reboot it every 15 min meanwhile. The controller must run without
# Home Assistant, so the API watchdog is off.
api:
  reboot_timeout: 0s

improv_serial:

# The web server's own firmware-upload page is the same unauthenticated
# LAN reflash path; the status pages and controls stay.
web_server:
  ota: false

safe_mode:

# Diagnostics for remote bring-up: what image is running, why it last
# rebooted and how much RAM is left (the S2 has none to spare).
debug:
  update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    icon: mdi:tag
    lambda: return {"${version}"};
  - platform: debug
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: debug
    free:
      name: "Free Heap"
    block:
      name: "Largest Free Block"
    loop_time:
      name: "Loop Time"
