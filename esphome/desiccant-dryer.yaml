# Production build: real sensors on the SparkFun ESP32-S2 Thing Plus, with
# the screen's drawing code and art from this checkout. CI compiles it and
# the release workflow builds the published images from it.
# Flash:  esphome run esphome/desiccant-dryer.yaml
# Contents: packages/production.yaml (shared with desiccant-dryer-adopt.yaml,
#           the Device Builder entry point). See docs/releasing.md.
substitutions:
  name: desiccant-dryer
  friendly_name: Desiccant Dryer

packages:
  production: !include packages/production.yaml
  ui: !include packages/ui-code-local.yaml
  # The owner flashes this image, so Home Assistant provisions its API key.
  # The adopt selector leaves this out; see the package's header.
  api: !include packages/api-provisioned.yaml
