# The production firmware version. Semantic versioning. Bump it in the PR
# that should become the next release; after the merge, scripts/release.sh
# tags main with the same number and the release workflow builds it.
# Only the production build includes this file (packages/production.yaml,
# wrapped by esphome/desiccant-dryer.yaml for the ESP32-S2 board and
# esphome/desiccant-dryer-c6.yaml for the ESP32-C6 board). Both chips share
# the one version number.
substitutions:
  version: "1.3.0"
