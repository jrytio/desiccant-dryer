id: T-B02
covers: [B-02, A-01]
type: infer
status: red            # needs Sim Relay Stuck On A and a heater-off-still-heating check
setup:
  Sim Speed: 60
  Sim Breakthrough Time: 5
  Sim RH Rise Rate: 5       # 0.1 %/min (the default) would take 45 sim min to reach arm_rh
  # Pinned so the verdict never turns on how fast a pack heats. 105 C also
  # keeps both packs clear of the 110 C overtemp default, which Sim Heater Max
  # Temp otherwise equals: a pack asymptotic to the limit makes the fault this
  # case is waiting for a coin flip.
  Sim Heater Max Temp: 105
  Sim Thermal Time Constant: 5
  Dryer Enabled: on
steps:
  - wait_until: {Standby State: heating}
    timeout_sim_min: 30
  - set: {Sim Relay Stuck On A: on}
  - wait_until: {Standby State: cooling}
    timeout_sim_min: 60
  - wait_sim_min: 10
  - expect:
      Heater A: off
      Fault: on
