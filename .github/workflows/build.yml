name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'hardware/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'hardware/**'

env:
  ESPHOME_VERSION: 2026.9.0
  # Workspace-relative so it needs no home-directory assumptions on the runner.
  TOOL_CACHE: .ci-cache/tools

# Compiles every build with the official ESPHome image at the same version as
# the local install. (esphome/build-action pins its own minimum ESPHome
# version, which drifted past ours.)
#
# Two caches keep repeat builds incremental; a cold ESP build spends minutes
# installing toolchains and compiling ~700 ESP-IDF objects.
# - toolchains: everything the image's entrypoint puts under /cache when that
#   directory is mounted. Since ESPHome 2026.8 the ESP-IDF builds are native
#   (no PlatformIO): the IDF frameworks, compilers, Python env and a ccache
#   all live in /cache/idf (~1.9 GB), so this one mount covers them. The
#   ccache means even a stale build directory recompiles quickly.
# - build: esphome/.esphome, so unchanged objects are not recompiled. Any
#   config change that touches sdkconfig (a new component, TLS, ...) still
#   rebuilds ESP-IDF; that is expected, and the ccache absorbs most of it.
# The container writes both as root; they are chowned back before saving.
jobs:
  lint-config:
    name: config lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide dummy secrets
        run: cp esphome/secrets.ci.yaml esphome/secrets.yaml
      # No toolchain or build cache: `esphome config` only validates YAML, so
      # this finishes in seconds and gates the much slower compile jobs' worth
      # of design invariants (tests/cases/*.yaml with `harness: ci-lint`).
      - name: Run the ci-lint verification cases
        run: |
          docker run --rm -v "$PWD:/config" -w /config \
            --entrypoint bash "ghcr.io/esphome/esphome:$ESPHOME_VERSION" \
            -c 'python3 tests/lint_config.py'
      # Plain bash and python3 on the runner: the script only copies files
      # and writes JSON, so its test needs neither the image nor a compile.
      - name: Test the release manifest script
        run: bash tests/make_manifest_test.sh
      - name: Hold the firmware pin map against the hardware pin map
        run: python3 tests/test_pinmap.py

  host-cases:
    name: host cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide dummy secrets
        run: cp esphome/secrets.ci.yaml esphome/secrets.yaml
      # Read-only: the compile host job owns this key and saves it. A miss
      # only costs a cold native compile, which is a fraction of an ESP one.
      - name: Restore build directory
        uses: actions/cache/restore@v6
        with:
          path: esphome/.esphome
          key: build-${{ env.ESPHOME_VERSION }}-host-${{ hashFiles('esphome/**') }}
          restore-keys: build-${{ env.ESPHOME_VERSION }}-host-
      # Same SDL2 install as the host compile variant; the runner then keeps
      # the display headless with SDL_VIDEODRIVER=dummy, so no display server
      # is needed (tests/cases/*.yaml without `harness: ci-lint`).
      - name: Run the host verification cases
        run: |
          docker run --rm -v "$PWD:/config" -w /config \
            --entrypoint bash "ghcr.io/esphome/esphome:$ESPHOME_VERSION" \
            -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends libsdl2-dev g++ > /dev/null && python3 tests/run_cases.py'
      # The container compiles as root on a cache miss. Nothing is saved from
      # here (the compile host job owns that key), but the next checkout would
      # trip over a root-owned build tree.
      - name: Hand the build directory back to the runner user
        if: always()
        run: '[ -d esphome/.esphome ] && sudo chown -R "$(id -u):$(id -g)" esphome/.esphome || true'

  compile:
    name: compile ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One toolchain cache per chip: ESPHome installs the ESP-IDF tools
          # for the target it is building (Xtensa for the S2, RISC-V for the
          # C6), so a cache saved by one chip's job lacks the other's
          # compiler. The C6 variants are named c6-<build>, not <build>-c6,
          # so the `build-...-production-` and `build-...-hw-test-` restore
          # prefixes below can never pick up a C6 build directory.
          # `package` runs the release packaging check on a production image.
          - variant: production
            yaml: esphome/desiccant-dryer.yaml
            toolchain: esp32s2
            package: esp32s2=esphome/.esphome/build/desiccant-dryer/build
          - variant: c6-production
            yaml: esphome/desiccant-dryer-c6.yaml
            toolchain: esp32c6
            package: esp32c6=esphome/.esphome/build/desiccant-dryer-c6/build
          - variant: virtual
            yaml: esphome/desiccant-dryer-virtual.yaml
            toolchain: esp32s2
          - variant: hw-test
            yaml: esphome/desiccant-dryer-hw-test.yaml
            toolchain: esp32s2
          - variant: c6-hw-test
            yaml: esphome/desiccant-dryer-hw-test-c6.yaml
            toolchain: esp32c6
          # The host builds compile natively. The sdl display validates by
          # running sdl2-config, so SDL2 must be installed before even
          # `esphome config` would pass.
          - variant: host
            yaml: esphome/desiccant-dryer-host.yaml
            toolchain: host
            prepare: apt-get update -qq && apt-get install -y -qq --no-install-recommends libsdl2-dev g++ > /dev/null &&
          - variant: scenarios
            yaml: esphome/desiccant-dryer-scenarios.yaml
            toolchain: host
            prepare: apt-get update -qq && apt-get install -y -qq --no-install-recommends libsdl2-dev g++ > /dev/null &&
    steps:
      - uses: actions/checkout@v7
      - name: Provide dummy secrets
        run: cp esphome/secrets.ci.yaml esphome/secrets.yaml

      - name: Restore toolchains
        id: toolchains
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TOOL_CACHE }}
          key: toolchains-${{ env.ESPHOME_VERSION }}-${{ matrix.toolchain }}-${{ hashFiles('esphome/packages/platform-*.yaml', 'esphome/packages/board-*.yaml') }}
          restore-keys: toolchains-${{ env.ESPHOME_VERSION }}-${{ matrix.toolchain }}-
      - name: Restore build directory
        id: build
        uses: actions/cache/restore@v6
        with:
          path: esphome/.esphome
          key: build-${{ env.ESPHOME_VERSION }}-${{ matrix.variant }}-${{ hashFiles('esphome/**') }}
          restore-keys: build-${{ env.ESPHOME_VERSION }}-${{ matrix.variant }}-

      - name: Compile ${{ matrix.variant }}
        run: |
          mkdir -p "$TOOL_CACHE"
          docker run --rm -v "$PWD:/config" -w /config \
            -v "$PWD/$TOOL_CACHE:/cache" \
            --entrypoint bash "ghcr.io/esphome/esphome:$ESPHOME_VERSION" \
            -c '${{ matrix.prepare }} exec /entrypoint.sh compile ${{ matrix.yaml }}'

      - name: Hand caches back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" "$TOOL_CACHE" esphome/.esphome
      # The packaging the release workflow does, on this job's own image:
      # proves the build directory is where release.yml looks for it and
      # that the image header names this chip.
      - name: Check the release packaging of this image
        if: matrix.package
        run: scripts/make-manifest.sh 0.0.0 "$RUNNER_TEMP/site" "" "${{ matrix.package }}"
      - name: Save toolchains
        if: steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TOOL_CACHE }}
          key: ${{ steps.toolchains.outputs.cache-primary-key }}
      - name: Save build directory
        if: steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: esphome/.esphome
          key: ${{ steps.build.outputs.cache-primary-key }}
