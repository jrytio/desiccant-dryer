name: build

on:
  push:
    branches: [main]
  pull_request:

# Compiles both builds with the official ESPHome image at the same version as
# the local install. (esphome/build-action pins its own minimum ESPHome
# version, which drifted past ours.)
jobs:
  compile:
    name: compile ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: production
            yaml: esphome/desiccant-dryer.yaml
          - variant: virtual
            yaml: esphome/desiccant-dryer-virtual.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Provide dummy secrets
        run: cp esphome/secrets.ci.yaml esphome/secrets.yaml
      - name: Compile ${{ matrix.variant }}
        run: >
          docker run --rm -v "$PWD:/config" -w /config
          ghcr.io/esphome/esphome:2026.1.4
          compile ${{ matrix.yaml }}

  # The two host builds compile natively inside the same image. The sdl
  # display validates by running sdl2-config, so SDL2 must be installed
  # before even `esphome config` would pass.
  compile-host:
    name: compile ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: host
            yaml: esphome/desiccant-dryer-host.yaml
          - variant: scenarios
            yaml: esphome/desiccant-dryer-scenarios.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Provide dummy secrets
        run: cp esphome/secrets.ci.yaml esphome/secrets.yaml
      - name: Compile ${{ matrix.variant }}
        run: >
          docker run --rm -v "$PWD:/config" -w /config --entrypoint bash
          ghcr.io/esphome/esphome:2026.1.4
          -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends libsdl2-dev g++ > /dev/null && esphome compile ${{ matrix.yaml }}"
